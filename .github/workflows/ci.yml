name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Uses the minimum version from engines (or fallback to LTS)
          node-version: "16"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run format, lint, and build
        run: npm run ci
